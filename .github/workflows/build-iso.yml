name: Build ISO
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build-iso:
    runs-on: ubuntu-latest  # x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | sudo podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build ISO
        run: |
          mkdir -p output-iso
          sudo podman pull ghcr.io/jasonkolodziej/porcelain-base:latest
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/output-iso:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build --type iso --rootfs btrfs \
            ghcr.io/jasonkolodziej/porcelain-base:latest

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: n5-pro-installer-iso
          path: output-iso/
          retention-days: 7
